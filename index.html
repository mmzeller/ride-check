  html, body { background:#09090b; margin:0; padding:0; }

  }

    35% {
      opacity: 1;

      filter: blur(0);

      transform: translateX(-50%) translateY(-3px) scale(1.08);

      transform: translateX(-50%) translateY(1px) scale(0.97);
      border-radius: 48% 52% 55% 45% / 52% 48% 45% 55%;
    }

      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
      border-radius: 9999px;
      filter: blur(0);
    }
  }

  .app-shell {
    background-color: #09090b;

  .seg-tabs {

  .seg-tab-icon {

  }

    position: absolute;
    top: 0;

    border: 1px solid #f59e0b;
    box-shadow: 0 2px 14px rgba(245, 158, 11, 0.3);
    transition: left 0.4s cubic-bezier(0.22, 1, 0.36, 1), width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 0;

  }
  .day-strip-btn {
    position: relative;
    z-index: 1;
    flex: 1;
    border-radius: 0.75rem;
    padding: 0.5rem 0.15rem;
    font-size: 0.875rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    letter-spacing: 0.05em;
    border: 1px solid #27272a;

    color: #a1a1aa;

    transition: color 0.25s ease, border-color 0.25s ease, background-color 0.25s ease;

    color: #09090b;
    font-weight: 700;

  }
  .view-panel {
    animation: view-in 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes view-in {
    0% {
      opacity: 0;
      transform: translateY(12px) scale(0.985);
      filter: blur(2px);
    }
    60% {
      filter: blur(0);
    }

      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }
  }

    animation: moto-float 2.4s ease-in-out infinite;

  }

    display: flex;

  .time-input {
    min-width: 0;

  .field-box {

<script type="text/plain" id="app-source">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

// Local storage shim — data lives in the browser
const storage = {
  get: async (key) => {
    try {
      const raw = localStorage.getItem(key);
      return raw !== null ? { key, value: raw } : null;
    } catch (e) {
      return null;
    }
  },
  set: async (key, value) => {
    try {
      localStorage.setItem(key, value);
      return { key, value };
    } catch (e) {
      return null;
    }
  },
};

// Minimal inline icon set
const IconBase = ({ children, className }) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">

);

/** Sportbike side profile for empty/loading accents */
function MotoSilhouette({ className }) {

      <ellipse cx="28" cy="48" rx="14" ry="14" stroke="currentColor" strokeWidth="3" />
      <ellipse cx="92" cy="48" rx="14" ry="14" stroke="currentColor" strokeWidth="3" />
      <circle cx="28" cy="48" r="5" fill="currentColor" opacity="0.35" />
      <circle cx="92" cy="48" r="5" fill="currentColor" opacity="0.35" />
      <path d="M42 48h30" stroke="currentColor" strokeWidth="3" strokeLinecap="round" />
      <path d="M55 48 48 28h18l8 12" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
      <path d="M48 28 40 22H28" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
      <path d="M66 28h14l10 14" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
      <path d="M80 22h12" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" />
      <path d="M42 36h8" stroke="currentColor" strokeWidth="2" strokeLinecap="round" opacity="0.6" />
    </svg>
  );
}

function SegmentedTabs({ options, value, onChange, className }) {
  const idx = Math.max(0, options.findIndex((o) => o.value === value));
  const n = options.length || 1;
  return (
    <div className={`seg-tabs ${className || ""}`} role="tablist">
      <div
        className="seg-indicator"
        style={{
          width: `calc((100% - 0.5rem) / ${n})`,
          left: `calc(0.25rem + ${idx} * ((100% - 0.5rem) / ${n}))`,
        }}
      />
      {options.map((o) => {
        const active = o.value === value;
        return (
          <button
            key={o.value}
            type="button"
            role="tab"
            aria-selected={active}
            onClick={() => onChange(o.value)}
            className={`seg-tab ${active ? "seg-tab-active" : ""}`}
          >
            {o.icon ? <span className="seg-tab-icon">{o.icon}</span> : null}
            {o.label}
          </button>
        );
      })}
    </div>
  );
}

const STORAGE_KEY = "ride-check-data";
const STORAGE_KEY_LOG = "ride-check-log";
const STORAGE_KEY_DAYSOFF = "ride-check-days-off";
const REFRESH_MS = 30 * 60 * 1000;

const DEFAULT_PREFS = {
  tempMin: 45,
  tempMax: 95,
  maxWind: 20,
  maxGust: 30,
  avoidRain: true,
  rainProbThreshold: 40,
  avoidFog: true,
  minVisibilityMiles: 2,
  avoidSnow: true,
  avoidHumidity: true,
  maxHumidity: 75,
  humidityTempThreshold: 70,
  hideOvernight: true,
  warnIceRisk: true,
  avoidDark: true,
  morningStart: "07:30",
  morningEnd: "08:30",
  eveningStart: "17:00",
  eveningEnd: "18:00",
  units: "imperial", // imperial | metric
};

const WEATHER_CODES = {
  0: ["Clear sky", "clear"], 1: ["Mainly clear", "clear"], 2: ["Partly cloudy", "cloudy"],
  3: ["Overcast", "cloudy"], 45: ["Fog", "fog"], 48: ["Rime fog", "fog"],
  51: ["Light drizzle", "rain"], 53: ["Drizzle", "rain"], 55: ["Dense drizzle", "rain"],
  56: ["Freezing drizzle", "rain"], 57: ["Freezing drizzle", "rain"], 61: ["Slight rain", "rain"],
  63: ["Rain", "rain"], 65: ["Heavy rain", "rain"], 66: ["Freezing rain", "rain"],
  67: ["Freezing rain", "rain"], 71: ["Slight snow", "snow"], 73: ["Snow", "snow"],
  75: ["Heavy snow", "snow"], 77: ["Snow grains", "snow"], 80: ["Rain showers", "rain"],
  81: ["Rain showers", "rain"], 82: ["Violent showers", "rain"], 85: ["Snow showers", "snow"],
  86: ["Snow showers", "snow"], 95: ["Thunderstorm", "storm"], 96: ["Thunderstorm + hail", "storm"],
  99: ["Thunderstorm + hail", "storm"],
};

function codeInfo(code) {
  return WEATHER_CODES[code] || ["Unknown", "clear"];
}

function WeatherIcon({ category, className }) {
  const map = {
    clear: Sun, cloudy: Cloud, fog: CloudFog, rain: CloudRain,
    snow: CloudSnow, storm: CloudLightning,
  };
  const Icon = map[category] || Cloud;
  return <Icon className={className} />;
}

function isNum(v) {
  return typeof v === "number" && !Number.isNaN(v);
}

function timeToMinutes(t) {
  if (!t || typeof t !== "string") return 0;
  const [h, m] = t.split(":").map(Number);
  return (h || 0) * 60 + (m || 0);
}

function fmtHour12(hourNum) {
  const h = ((hourNum % 24) + 24) % 24;
  const period = h < 12 ? "a" : "p";
  let h12 = h % 12;
  if (h12 === 0) h12 = 12;
  return `${h12}${period}`;
}

function fmtTimeIso(iso) {
  if (!iso) return "--:--";
  const hh = parseInt(iso.slice(11, 13), 10);
  const mm = iso.slice(14, 16);
  const period = hh < 12 ? "AM" : "PM";
  let h12 = hh % 12;
  if (h12 === 0) h12 = 12;
  return `${h12}:${mm} ${period}`;
}

function nowKeyForTz(tz) {
  try {
    const parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: tz,
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      hourCycle: "h23",
    }).formatToParts(new Date());
    const get = (type) => parts.find((p) => p.type === type)?.value || "00";
    return `${get("year")}-${get("month")}-${get("day")}T${get("hour")}:${get("minute")}`;
  } catch (e) {
    return new Date().toISOString().slice(0, 16);
  }
}

function labelPartsInTz(dateKey, tz) {
  try {
    const d = new Date(dateKey + "T12:00:00Z");
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone: tz,
      weekday: "long",
      month: "short",
      day: "numeric",
    }).formatToParts(d);
    const get = (type) => parts.find((p) => p.type === type)?.value || "";
    const weekday = get("weekday");
    const short = new Intl.DateTimeFormat("en-US", { timeZone: tz, weekday: "short" }).format(d);
    const isWeekend = weekday === "Saturday" || weekday === "Sunday";
    return {
      dateLabel: `${weekday}, ${get("month")} ${get("day")}`,
      shortLabel: short,
      isWeekend,
    };
  } catch (e) {
    const noon = new Date(dateKey + "T12:00:00Z");
    return {
      dateLabel: noon.toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric", timeZone: "UTC" }),
      shortLabel: noon.toLocaleDateString("en-US", { weekday: "short", timeZone: "UTC" }),
      isWeekend: [0, 6].includes(noon.getUTCDay()),
    };
  }
}

/** Forecast hour H represents [H:00, H+1:00). Overlap with [start, end); supports overnight. */
function hoursInWindow(hours, start, end) {
  if (!hours || !hours.length) return [];
  const s = timeToMinutes(start);
  let e = timeToMinutes(end);
  if (e === s) e = s + 60; // zero-length → treat as one hour
  const overnight = e < s;
  if (overnight) e += 24 * 60;

  const overlaps = (a0, a1, b0, b1) => a0 < b1 && b0 < a1;

  return hours.filter((h) => {
    const hs = h.hourNum * 60;
    const he = hs + 60;
    if (overlaps(hs, he, s, e)) return true;
    if (overnight && overlaps(hs + 1440, he + 1440, s, e)) return true;
    // also allow hour on previous calendar sense when window crosses midnight
    if (overnight && overlaps(hs - 1440, he - 1440, s, e)) return true;
    return false;
  });
}

function isoToMinutes(iso) {
  if (!iso || iso.length < 16) return null;
  const hh = parseInt(iso.slice(11, 13), 10);
  const mm = parseInt(iso.slice(14, 16), 10);
  if (Number.isNaN(hh) || Number.isNaN(mm)) return null;
  return hh * 60 + mm;
}

/** Softer dark check: hour is "dark" if its midpoint is outside daylight. */
function hourIsDark(hour, sun) {
  if (!sun || !sun.sunriseIso || !sun.sunsetIso) return false;
  const mid = hour.hourNum * 60 + 30;
  const sr = isoToMinutes(sun.sunriseIso);
  const ss = isoToMinutes(sun.sunsetIso);
  if (sr == null || ss == null) return false;
  return mid < sr || mid > ss;
}

function evaluateHour(hour, prefs, sun) {
  const reasons = [];
  const [, category] = codeInfo(hour.weathercode);
  const metric = prefs.units === "metric";

  if (isNum(hour.temp)) {
    if (hour.temp < prefs.tempMin) {
      reasons.push(`Too cold (${Math.round(hour.temp)}°${metric ? "C" : "F"})`);
    }
    if (hour.temp > prefs.tempMax) {
      reasons.push(`Too hot (${Math.round(hour.temp)}°${metric ? "C" : "F"})`);
    }
  }

  const windUnit = metric ? "km/h" : "mph";
  if (isNum(hour.wind) && hour.wind > prefs.maxWind) {
    reasons.push(`Wind ${Math.round(hour.wind)} ${windUnit}`);
  }
  if (isNum(hour.gust) && hour.gust > prefs.maxGust) {
    reasons.push(`Gusts ${Math.round(hour.gust)} ${windUnit}`);
  }

  if (category === "storm") reasons.push("Thunderstorm");

  if (prefs.avoidRain && category !== "storm") {
    const rainy = category === "rain";
    const probHit = isNum(hour.precipProb) && hour.precipProb >= prefs.rainProbThreshold;
    if (rainy || probHit) {
      reasons.push(probHit ? `${hour.precipProb}% rain chance` : "Rain expected");
    }
  }

  if (prefs.avoidSnow && category === "snow") reasons.push("Snow expected");

  if (prefs.avoidFog) {
    const foggy = category === "fog";
    // prefs.minVisibilityMiles holds miles (imperial) or km (metric); hourly value is always miles
    const minVisMiles = metric ? prefs.minVisibilityMiles / 1.60934 : prefs.minVisibilityMiles;
    const lowVis = isNum(hour.visibilityMiles) && hour.visibilityMiles < minVisMiles;
    if (foggy || lowVis) {
      const vis = isNum(hour.visibilityMiles)
        ? (metric ? `${(hour.visibilityMiles * 1.60934).toFixed(1)} km` : `${hour.visibilityMiles.toFixed(1)} mi`)
        : "low";
      reasons.push(`Visibility ${vis}`);
    }
  }

  if (
    prefs.avoidHumidity &&
    isNum(hour.temp) &&
    isNum(hour.humidity) &&
    hour.temp >= prefs.humidityTempThreshold &&
    hour.humidity > prefs.maxHumidity
  ) {
    reasons.push(`${hour.humidity}% humidity`);
  }

  if (prefs.warnIceRisk && isNum(hour.temp)) {
    const freezeF = metric ? hour.temp <= 1 : hour.temp <= 34;
    if (freezeF) {
      const wet = isNum(hour.precip) && hour.precip > 0;
      reasons.push(wet ? "Ice risk (wet + freeze)" : metric ? "Possible ice (≤1°C)" : "Possible ice (≤34°F)");
    }
  }

  if (prefs.avoidDark && sun && hourIsDark(hour, sun)) {
    reasons.push("Outside daylight");
  }

  return { good: reasons.length === 0, reasons, category };
}

function commuteVerdict(hours, prefs, sun) {
  if (!hours || hours.length === 0) return { status: "unknown", reasons: [], score: null };
  const evals = hours.map((h) => evaluateHour(h, prefs, sun));
  const goodCount = evals.filter((e) => e.good).length;
  const score = Math.round((goodCount / evals.length) * 100);
  const reasons = [...new Set(evals.flatMap((e) => e.reasons))];
  // Align with gauge: GO ≥ 90, CAUTION 50–89 shown as soft bad, NO-GO < 50
  // Commute cards stay binary: GO only if every hour is good (strict safety)
  const good = evals.every((e) => e.good);
  return { status: good ? "good" : "bad", reasons, score };
}

function scoreFromHours(hours, prefs, sun) {
  if (!hours || !hours.length) return null;
  const goodCount = hours.filter((h) => evaluateHour(h, prefs, sun).good).length;
  return { good: goodCount, total: hours.length };
}

function computeRideScore(morningHours, eveningHours, prefs, homeSun, workSun) {
  const m = scoreFromHours(morningHours, prefs, homeSun);
  const e = scoreFromHours(eveningHours, prefs, workSun);
  const totalGood = (m ? m.good : 0) + (e ? e.good : 0);
  const totalHours = (m ? m.total : 0) + (e ? e.total : 0);
  if (totalHours === 0) return null;
  return Math.round((totalGood / totalHours) * 100);
}

function conditionFlags(hours, prefs, sun) {
  const flags = { temp: false, wind: false, rain: false, fog: false, snow: false, storm: false, humidity: false, ice: false, dark: false };
  if (!hours) return flags;
  const metric = prefs.units === "metric";
  hours.forEach((hour) => {
    const [, category] = codeInfo(hour.weathercode);
    if (isNum(hour.temp) && (hour.temp < prefs.tempMin || hour.temp > prefs.tempMax)) flags.temp = true;
    if ((isNum(hour.wind) && hour.wind > prefs.maxWind) || (isNum(hour.gust) && hour.gust > prefs.maxGust)) flags.wind = true;
    if (category === "storm") flags.storm = true;
    if (prefs.avoidRain && category !== "storm" && (category === "rain" || (isNum(hour.precipProb) && hour.precipProb >= prefs.rainProbThreshold))) flags.rain = true;
    if (prefs.avoidSnow && category === "snow") flags.snow = true;
    {
      const minVisMiles = metric ? prefs.minVisibilityMiles / 1.60934 : prefs.minVisibilityMiles;
      if (prefs.avoidFog && (category === "fog" || (isNum(hour.visibilityMiles) && hour.visibilityMiles < minVisMiles))) flags.fog = true;
    }
    if (prefs.avoidHumidity && isNum(hour.temp) && isNum(hour.humidity) && hour.temp >= prefs.humidityTempThreshold && hour.humidity > prefs.maxHumidity) flags.humidity = true;
    if (prefs.warnIceRisk && isNum(hour.temp) && (metric ? hour.temp <= 1 : hour.temp <= 34)) flags.ice = true;
    if (prefs.avoidDark && sun && hourIsDark(hour, sun)) flags.dark = true;
  });
  return flags;
}

function mergeFlags(a, b) {
  const out = {};
  Object.keys(a).forEach((k) => { out[k] = a[k] || b[k]; });
  return out;
}

function gearSuggestion(temp, maxTemp, flags, metric) {
  if (!isNum(temp)) return null;
  let jacket, gloves;
  const extra = [];
  // Thresholds in display units already stored in prefs space (user units)
  if (metric) {
    if (temp < 0) { jacket = "Insulated/heated suit"; gloves = "Insulated winter gloves"; extra.push("Balaclava or neck gaiter"); }
    else if (temp < 7) { jacket = "Insulated jacket + thermal liner"; gloves = "Winter gloves"; extra.push("Neck gaiter"); }
    else if (temp < 16) { jacket = "Mid-weight jacket + liner"; gloves = "Mid-weight gloves"; }
    else if (temp < 24) { jacket = "Standard armored jacket"; gloves = "Standard gloves"; }
    else if (temp < 29) { jacket = "Vented/mesh jacket"; gloves = "Lightweight gloves"; }
    else { jacket = "Mesh jacket, minimal layers"; gloves = "Vented gloves"; extra.push("Bring water"); }
  } else {
    if (temp < 32) { jacket = "Insulated/heated suit"; gloves = "Insulated winter gloves"; extra.push("Balaclava or neck gaiter"); }
    else if (temp < 45) { jacket = "Insulated jacket + thermal liner"; gloves = "Winter gloves"; extra.push("Neck gaiter"); }
    else if (temp < 60) { jacket = "Mid-weight jacket + liner"; gloves = "Mid-weight gloves"; }
    else if (temp < 75) { jacket = "Standard armored jacket"; gloves = "Standard gloves"; }
    else if (temp < 85) { jacket = "Vented/mesh jacket"; gloves = "Lightweight gloves"; }
    else { jacket = "Mesh jacket, minimal layers"; gloves = "Vented gloves"; extra.push("Bring water"); }
  }
  if (flags.rain) extra.push("Rain gear");
  if (flags.wind) extra.push("Wind-resistant layer");
  if (flags.ice) extra.push("Extra traction awareness");
  const unit = metric ? "°C" : "°F";
  const range =
    isNum(maxTemp) && Math.round(maxTemp) !== Math.round(temp)
      ? `${Math.round(temp)}–${Math.round(maxTemp)}${unit}`
      : `${Math.round(temp)}${unit}`;
  return { jacket, gloves, extra, tempLabel: range };
}

function polarPoint(cx, cy, r, tFrac) {
  const phi = ((135 + 270 * tFrac) * Math.PI) / 180;
  return [cx + r * Math.cos(phi), cy + r * Math.sin(phi)];
}

function arcPath(cx, cy, r, t0, t1) {
  const [x0, y0] = polarPoint(cx, cy, r, t0);
  const [x1, y1] = polarPoint(cx, cy, r, t1);
  const largeArc = (t1 - t0) * 270 > 180 ? 1 : 0;
  return `M ${x0} ${y0} A ${r} ${r} 0 ${largeArc} 1 ${x1} ${y1}`;
}

function rawHourFraction(iso, startHour, tickCount) {
  const hh = parseInt(iso.slice(11, 13), 10);
  const mm = parseInt(iso.slice(14, 16), 10);
  return (hh + mm / 60 - startHour) / tickCount;
}

function clampedHourFraction(iso, hours) {
  if (!iso || !hours.length) return null;
  const f = rawHourFraction(iso, hours[0].hourNum, hours.length);
  if (f < 0 || f > 1) return null;
  return f;
}

function darknessGradient(sun, hours) {
  if (!sun || !hours.length) return "none";
  const startHour = hours[0].hourNum;
  const sr = rawHourFraction(sun.sunriseIso, startHour, hours.length);
  const ss = rawHourFraction(sun.sunsetIso, startHour, hours.length);
  const dark = "rgba(0,0,0,0.45)";
  const clear = "rgba(0,0,0,0)";
  const pct = (f) => `${Math.max(-25, Math.min(125, f * 100)).toFixed(1)}%`;
  return `linear-gradient(to right, ${dark} 0%, ${dark} ${pct(sr)}, ${clear} ${pct(sr + 0.02)}, ${clear} ${pct(ss - 0.02)}, ${dark} ${pct(ss)}, ${dark} 100%)`;
}

function findBestWindow(hours, prefs, sun, minLen = 2) {
  if (!hours || hours.length < minLen) return null;
  let best = null;
  let i = 0;
  while (i < hours.length) {
    const ev = evaluateHour(hours[i], prefs, sun);
    if (!ev.good) { i += 1; continue; }
    let j = i + 1;
    while (j < hours.length && evaluateHour(hours[j], prefs, sun).good) j += 1;
    const len = j - i;
    if (len >= minLen && (!best || len > best.len || (len === best.len && i < best.startIdx))) {
      best = { startIdx: i, endIdx: j - 1, len, start: hours[i], end: hours[j - 1] };
    }
    i = j;
  }
  return best;
}

function computeDays(weather) {
  if (!weather) return [];
  const h = weather.hourly;
  if (!h || !h.time) return [];
  const tz = weather.timezone || Intl.DateTimeFormat().resolvedOptions().timeZone;
  const nowKey = nowKeyForTz(tz);
  const todayDateKey = nowKey.slice(0, 10);
  const nowHourKey = nowKey.slice(0, 13) + ":00";

  const dailySun = {};
  if (weather.daily && weather.daily.time) {
    weather.daily.time.forEach((d, i) => {
      dailySun[d] = {
        sunriseIso: weather.daily.sunrise[i],
        sunsetIso: weather.daily.sunset[i],
      };
    });
  }

  const grouped = {};
  h.time.forEach((t, i) => {
    const dateKey = t.slice(0, 10);
    const hourNum = parseInt(t.slice(11, 13), 10);
    if (!grouped[dateKey]) grouped[dateKey] = [];
    const visM = h.visibility && h.visibility[i] != null ? h.visibility[i] / 1609.34 : null;
    grouped[dateKey].push({
      iso: t,
      hourNum,
      hourLabel: fmtHour12(hourNum),
      temp: h.temperature_2m ? h.temperature_2m[i] : null,
      precipProb: h.precipitation_probability ? h.precipitation_probability[i] : null,
      precip: h.precipitation ? h.precipitation[i] : null,
      wind: h.windspeed_10m ? h.windspeed_10m[i] : null,
      gust: h.windgusts_10m ? h.windgusts_10m[i] : null,
      visibilityMiles: visM,
      weathercode: h.weathercode ? h.weathercode[i] : 0,
      humidity: h.relative_humidity_2m ? h.relative_humidity_2m[i] : null,
    });
  });

  return Object.entries(grouped)
    .sort(([a], [b]) => a.localeCompare(b))
    .slice(0, 7)
    .map(([date, hours]) => {
      const isToday = date === todayDateKey;
      const filteredHours = isToday ? hours.filter((x) => x.iso >= nowHourKey) : hours;
      const labels = labelPartsInTz(date, tz);
      return {
        date,
        isToday,
        isWeekend: labels.isWeekend,
        dateLabel: labels.dateLabel,
        shortLabel: labels.shortLabel,
        hours: filteredHours,
        sun: dailySun[date],
        timezone: tz,
      };
    });
}

function clampNum(v, min, max) {
  const n = Number(v);
  if (Number.isNaN(n)) return min;
  return Math.min(max, Math.max(min, n));
}

function Toggle({ checked, onChange, label, hint }) {
  return (
    <button
      type="button"
      role="switch"
      aria-checked={checked}
      onClick={() => onChange(!checked)}
      className="w-full flex items-center justify-between gap-3 py-2.5 text-left"
    >

function LocationPicker({ value, onChange, allowCurrent = true }) {
  const [query, setQuery] = useState("");
  const [results, setResults] = useState([]);
  const [searching, setSearching] = useState(false);
  const [locating, setLocating] = useState(false);
  const [err, setErr] = useState(null);

  const search = async () => {
    if (!query.trim()) return;
    setSearching(true);
    setResults([]);
    setErr(null);
    try {
      const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query.trim())}&count=5&language=en&format=json`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("bad response");
      const json = await res.json();
      const list = json.results || [];
      if (list.length === 0) setErr("No matching places found.");
      setResults(list);
    } catch (e) {
      setErr("Location search failed. Check your connection.");
    } finally {
      setSearching(false);
    }
  };

  const useCurrent = () => {
    if (!navigator.geolocation) {
      setErr("Geolocation isn't available here.");
      return;
    }
    setLocating(true);
    setErr(null);
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        onChange({ name: "Current location", lat: pos.coords.latitude, lon: pos.coords.longitude });
        setLocating(false);
      },
      () => {
        setErr("Couldn't get your location — enter it manually.");
        setLocating(false);
      },
      { timeout: 8000, enableHighAccuracy: false }
    );
  };

  if (value) {
    return (
      <div className="flex items-center justify-between rounded-lg bg-zinc-800 px-3 py-2">
        <span className="flex items-center gap-2 text-sm truncate">
          <MapPin className="w-4 h-4 text-amber-400 shrink-0" />
          <span className="truncate">{value.name}</span>
        </span>
        <button type="button" onClick={() => onChange(null)} className="text-zinc-500 hover:text-zinc-300 shrink-0" aria-label="Clear location">
          <X className="w-4 h-4" />
        </button>
      </div>
    );
  }

  return (
    <div className="space-y-2">
      <div className="flex gap-2">
        <input
          type="text"
          value={query}
          onChange={(e) => setQuery(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && search()}
          placeholder="City, address, or zip"
          aria-label="Search location"
          className="flex-1 rounded-lg border border-zinc-700 bg-zinc-800 px-3 py-2 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-amber-400"
        />
        <button type="button" onClick={search} className="px-3 rounded-lg bg-zinc-800 border border-zinc-700 text-zinc-300 hover:bg-zinc-700" aria-label="Search">
          {searching ? <Loader2 className="w-4 h-4 animate-spin" /> : <Search className="w-4 h-4" />}
        </button>
      </div>
      {allowCurrent && (
        <button type="button" onClick={useCurrent} className="flex items-center gap-1.5 text-sm text-amber-400 hover:text-amber-300">
          {locating ? <Loader2 className="w-3.5 h-3.5 animate-spin" /> : <Navigation className="w-3.5 h-3.5" />}
          Use my current location
        </button>
      )}
      {err && <p className="text-sm text-red-400" role="alert">{err}</p>}
      {results.length > 0 && (
        <div className="space-y-1 pt-1">
          {results.map((r, i) => {
            const bits = [r.name, r.admin1, r.country].filter(Boolean);
            const label = bits.join(", ");
            return (
              <button
                key={`${r.latitude}-${r.longitude}-${i}`}
                type="button"
                onClick={() => {
                  onChange({ name: label, lat: r.latitude, lon: r.longitude });
                  setResults([]);
                  setQuery("");
                }}
                className="w-full text-left text-sm px-3 py-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-200"
              >
                {label}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function RideGauge({ score }) {
  const cx = 100, cy = 105, r = 82;
  const known = score !== null && score !== undefined;
  const clamped = known ? Math.max(0, Math.min(100, score)) : 0;
  const needleRotation = 270 * (clamped / 100) - 135;
  const zones = [
    { from: 0, to: 0.49, color: "#ef4444" },
    { from: 0.49, to: 0.7, color: "#f59e0b" },
    { from: 0.7, to: 1, color: "#10b981" },
  ];
  return (
    <svg viewBox="0 0 200 148" className="w-full max-w-[170px] mx-auto block" role="img" aria-label={known ? `Ride score ${clamped}` : "No ride score"}>
      {[0, 0.25, 0.5, 0.75, 1].map((t, i) => {
        const [x1, y1] = polarPoint(cx, cy, r + 6, t);
        const [x2, y2] = polarPoint(cx, cy, r + 15, t);
        return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="#52525b" strokeWidth="2" />;
      })}
      {zones.map((z, i) => (
        <path key={i} d={arcPath(cx, cy, r, z.from, z.to)} fill="none" stroke={z.color} strokeWidth="10" opacity={known ? 0.9 : 0.25} />
      ))}
      {known && (
        <g transform={`rotate(${needleRotation} ${cx} ${cy})`}>
          <polygon points={`${cx},${cy - r + 20} ${cx - 3.5},${cy} ${cx + 3.5},${cy}`} fill="#f4f4f5" />
        </g>
      )}
      <circle cx={cx} cy={cy} r="7" fill="#18181b" stroke="#fbbf24" strokeWidth="2" />
      <text x={cx} y={cy + 34} textAnchor="middle" fontFamily="ui-monospace, monospace" fontSize="32" fontWeight="700" fill="#f4f4f5">
        {known ? clamped : "\u2014"}
      </text>
    </svg>
  );
}

function WarningLights({ flags }) {
  const items = [
    { key: "temp", Icon: Thermometer, title: "Temperature" },
    { key: "wind", Icon: Wind, title: "Wind" },
    { key: "rain", Icon: CloudRain, title: "Rain" },
    { key: "fog", Icon: CloudFog, title: "Fog" },
    { key: "snow", Icon: CloudSnow, title: "Snow" },
    { key: "storm", Icon: CloudLightning, title: "Storm" },
    { key: "humidity", Icon: Droplet, title: "Humidity" },
    { key: "ice", Icon: Snowflake, title: "Ice risk" },
    { key: "dark", Icon: Moon, title: "Darkness" },
  ];
  const [activeKey, setActiveKey] = useState(null);
  const timerRef = useRef(null);

  const show = (key) => {
    if (timerRef.current) clearTimeout(timerRef.current);
    setActiveKey((prev) => (prev === key ? null : key));
    timerRef.current = setTimeout(() => setActiveKey(null), 2200);
  };

  useEffect(() => {
    const dismiss = () => setActiveKey(null);
    document.addEventListener("pointerdown", dismiss);
    return () => {
      document.removeEventListener("pointerdown", dismiss);
      if (timerRef.current) clearTimeout(timerRef.current);
    };
  }, []);

  return (
    <div className="indicator-grid">
      {items.map(({ key, Icon, title }) => (
        <WarningLight
          key={key}
          on={!!flags[key]}
          Icon={Icon}
          title={title}
          active={activeKey === key}
          onPress={() => show(key)}
        />
      ))}
    </div>
  );
}

function WeekRow({ day, workDay, prefs, onSelect, noCommute }) {
  const morning = commuteVerdict(hoursInWindow(day.hours, prefs.morningStart, prefs.morningEnd), prefs, day.sun);

  const temps = day.hours.map((h) => h.temp).filter(isNum);
  const hi = temps.length ? Math.round(Math.max(...temps)) : null;
  const lo = temps.length ? Math.round(Math.min(...temps)) : null;
  const midHour = day.hours[Math.floor(day.hours.length / 2)];
  const midCategory = midHour ? codeInfo(midHour.weathercode)[1] : "clear";
  const flags = mergeFlags(
    conditionFlags(hoursInWindow(day.hours, prefs.morningStart, prefs.morningEnd), prefs, day.sun),
    conditionFlags(hoursInWindow(workDay.hours, prefs.eveningStart, prefs.eveningEnd), prefs, workDay.sun)
  );
  const issueIcons = [
    flags.rain && CloudRain,
    flags.wind && Wind,
    flags.storm && CloudLightning,
    flags.ice && Snowflake,
    flags.snow && CloudSnow,
    flags.fog && CloudFog,
  ].filter(Boolean).slice(0, 3);

  return (
    <button type="button" onClick={onSelect} className="w-full flex items-center gap-3 rounded-xl border border-zinc-800 bg-zinc-900 px-3 py-3 text-left hover:border-zinc-700">
      <WeatherIcon category={midCategory} className="w-5 h-5 text-zinc-500 shrink-0" />
      <div className="w-20 shrink-0">
        <div className="text-sm text-zinc-200">{day.isToday ? "Today" : day.shortLabel}</div>
        <div className="text-sm text-zinc-500 font-mono">{hi != null ? `${hi}°/${lo}°` : "—"}</div>
      </div>
      {noCommute ? (
        <span className="text-sm text-zinc-600 font-mono">no commute</span>
      ) : (
        <>
          <VerdictPill label="AM" status={morning.status} />
          <VerdictPill label="PM" status={evening.status} />
          {issueIcons.length > 0 && (
            <span className="flex items-center gap-1 text-amber-500/80">
              {issueIcons.map((Icon, i) => <Icon key={i} className="w-3.5 h-3.5" />)}
            </span>
          )}
        </>
      )}
      <span className="ml-auto text-zinc-600 text-sm" aria-hidden="true">→</span>

  );

function convertPrefsUnits(prefs, toMetric) {
  if ((prefs.units === "metric") === toMetric) return prefs;
  const f2c = (f) => Math.round(((f - 32) * 5) / 9);
  const c2f = (c) => Math.round((c * 9) / 5 + 32);
  const mph2kph = (m) => Math.round(m * 1.60934);
  const kph2mph = (k) => Math.round(k / 1.60934);
  const mi2km = (m) => Math.round(m * 1.60934 * 10) / 10;
  const km2mi = (k) => Math.round((k / 1.60934) * 10) / 10;
  if (toMetric) {
    return {
      ...prefs,
      units: "metric",
      tempMin: f2c(prefs.tempMin),
      tempMax: f2c(prefs.tempMax),
      maxWind: mph2kph(prefs.maxWind),
      maxGust: mph2kph(prefs.maxGust),
      minVisibilityMiles: mi2km(prefs.minVisibilityMiles),
      humidityTempThreshold: f2c(prefs.humidityTempThreshold),
    };
  }
  return {
    ...prefs,
    units: "imperial",
    tempMin: c2f(prefs.tempMin),
    tempMax: c2f(prefs.tempMax),
    maxWind: kph2mph(prefs.maxWind),
    maxGust: kph2mph(prefs.maxGust),
    minVisibilityMiles: km2mi(prefs.minVisibilityMiles),
    humidityTempThreshold: c2f(prefs.humidityTempThreshold),
  };
}

function App() {
  const [loaded, setLoaded] = useState(false);
  const [data, setData] = useState(null);
  const [editing, setEditing] = useState(false);
  const [showLog, setShowLog] = useState(false);
  const [weatherHome, setWeatherHome] = useState(null);
  const [weatherWork, setWeatherWork] = useState(null);
  const [loadingWeather, setLoadingWeather] = useState(false);
  const [error, setError] = useState(null);
  const [dayIndex, setDayIndex] = useState(0);
  const [mainView, setMainView] = useState("daily");
  const [hourlyLoc, setHourlyLoc] = useState("home");
  const [rideLog, setRideLog] = useState({});
  const [daysOff, setDaysOff] = useState({});
  const [lastUpdated, setLastUpdated] = useState(null);
  const locationsRef = useRef(null);

  const [formPrefs, setFormPrefs] = useState(DEFAULT_PREFS);
  const [formLocations, setFormLocations] = useState({ home: null, work: null });

  const loadWeather = useCallback(async (locations) => {
    if (!locations || !locations.home) return;
    locationsRef.current = { home: locations.home, work: locations.work || null };
    setLoadingWeather(true);
    setError(null);
    try {
      const unitsMetric = typeof locations._unitsMetric === "boolean"
        ? locations._unitsMetric
        : !!(data && data.prefs && data.prefs.units === "metric");

      const tempUnit = unitsMetric ? "celsius" : "fahrenheit";

            `&hourly=temperature_2m,precipitation_probability,precipitation,windspeed_10m,windgusts_10m,visibility,weathercode,relative_humidity_2m` +
            `&daily=sunrise,sunset&temperature_unit=${tempUnit}&windspeed_unit=${windUnit}&timezone=auto&forecast_days=7`
        ).then((r) => {
          if (!r.ok) throw new Error("bad response");
          return r.json();
        });

      const [homeJson, workJson] = await Promise.all([
        fetchOne(locations.home),
        locations.work ? fetchOne(locations.work) : Promise.resolve(null),
      ]);
      setWeatherHome(homeJson);
      setWeatherWork(workJson);
      setDayIndex(0);
      setLastUpdated(Date.now());
    } catch (e) {
      setError("Couldn't load the forecast. Check your connection and try again.");
    } finally {
      setLoadingWeather(false);
    }

      persistLog(next);

                          className={`day-strip-btn ${i === dayIndex ? "day-strip-btn-active" : ""}`}
                        >
                          {d.isToday ? "TODAY" : d.shortLabel.toUpperCase()}
                        </button>
                      ))}
                    </div>

                    <div className="flex flex-col items-center gap-1">
                      <SunTimes sun={homeDay && homeDay.sun} />
                      {updatedLabel && (
                        <span className="text-sm text-zinc-600 font-mono">Updated {updatedLabel}</span>
                      )}
                    </div>

                    {!isWeekend && homeDay && (
                      <button
                        type="button"
                        onClick={() => toggleDayOff(homeDay.date)}
                        className={`w-full rounded-xl py-2 text-sm font-mono tracking-wide border ${isOff ? "bg-amber-500 text-zinc-950 border-amber-500 font-bold" : "bg-zinc-900 text-zinc-400 border-zinc-800"}`}
                      >
                        {isOff ? "OFF WORK THIS DAY — TAP TO UNDO" : "MARK AS DAY OFF"}
                      </button>
                    )}

                    {!homeDay || homeDay.hours.length === 0 ? (
                      <div className="text-center text-zinc-500 text-sm py-10 empty-ride">
                        <MotoSilhouette className="w-24 h-12 mx-auto text-zinc-700 mb-3" />
                        No more riding hours left today.
                      </div>
                    ) : (
                      <>
                        {!noCommute && <RideGaugeCard score={rideScore} flags={warningFlags} />}

                        {noCommute && (
                          <div className="text-center text-zinc-500 text-sm py-1">
                            {isWeekend ? "Weekend" : "Day off"} — no fixed commute.{" "}
                            {homeDay.isToday && freeRideHours.length > 0
                              ? "Check the free ride card and hourly details below."
                              : "Check the hourly details below."}
                          </div>
                        )}

                        {bestWindow && (
                          <BestWindowCard window={bestWindow} />
                        )}

                        {homeDay.isToday && freeRideHours.length > 0 && (
                          <CommuteCard label="Free ride" sublabel={`At ${data.locations.home.name}`} windowLabel="Next few hours" verdict={freeRideVerdict} />
                        )}

                        {!noCommute && (
                          <div className="space-y-3">
                            <CommuteCard
                              label="Morning commute"
                              sublabel={hasWork ? `At ${data.locations.home.name}` : null}
                              windowLabel={`${prefs.morningStart} – ${prefs.morningEnd}`}
                              verdict={morningVerdict}
                            />
                            <CommuteCard
                              label="Evening commute"
                              sublabel={hasWork ? `At ${data.locations.work.name}` : null}
                              windowLabel={`${prefs.eveningStart} – ${prefs.eveningEnd}`}
                              verdict={eveningVerdict}
                            />
                          </div>
                        )}

                        <GearCard gear={gear} />

                        {homeDay.isToday && (
                          <div className="rounded-2xl border border-zinc-800 bg-zinc-900 card-pad">
                            <h3 className="text-sm font-semibold uppercase tracking-widest text-amber-400 mb-3">Log today's ride</h3>
                            <div className="flex gap-2">
                              <LogToggleButton label="Rode this morning" active={!!(rideLog[todayKey] && rideLog[todayKey].morning)} onClick={() => toggleLog(todayKey, "morning")} />
                              <LogToggleButton label="Rode this evening" active={!!(rideLog[todayKey] && rideLog[todayKey].evening)} onClick={() => toggleLog(todayKey, "evening")} />
                            </div>
                          </div>
                        )}

                        {hasWork && !noCommute && (
                          <SegmentedTabs
                            value={hourlyLoc}
                            onChange={setHourlyLoc}
                            options={[
                              { value: "home", label: "HOME" },
                              { value: "work", label: "WORK" },
                            ]}
                          />
                        )}

                        <div className="rounded-2xl border border-zinc-800 bg-zinc-900 card-pad">
                          <h3 className="text-sm font-semibold uppercase tracking-widest text-amber-400 mb-3">Hourly readout</h3>
                          <div className="overflow-x-auto">
                            <div className="relative min-w-max">
                              <div className="absolute inset-0 rounded-lg pointer-events-none" style={{ background: gaugeGradient }} />
                              {sunriseFrac !== null && (
                                <div className="absolute top-0 bottom-0 w-px bg-amber-400/70 pointer-events-none" style={{ left: `${sunriseFrac * 100}%` }} />
                              )}
                              {sunsetFrac !== null && (
                                <div className="absolute top-0 bottom-0 w-px bg-amber-400/70 pointer-events-none" style={{ left: `${sunsetFrac * 100}%` }} />
                              )}
                              <div className="relative flex items-end gap-1 h-20">
                                {hourEvals.map(({ hour, ev }, i) => {
                                  const t = isNum(hour.temp) ? hour.temp : minTemp;
                                  const pct = Math.max(((t - minTemp) / tempRange) * 100, 8);
                                  return (
                                    <div key={i} className="flex flex-col items-center justify-end h-full w-3 shrink-0">
                                      <div title={`${hour.hourLabel} — ${isNum(hour.temp) ? Math.round(hour.temp) + "°" : "—"}`} className={`w-2.5 rounded-t ${ev.good ? "bg-emerald-500" : "bg-red-500"}`} style={{ height: `${pct}%` }} />
                                      <div className={`w-1 h-1 rounded-full mt-1 ${!noCommute && (inMorningWindow(hour) || inEveningWindow(hour)) ? "bg-amber-400" : "bg-transparent"}`} />
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                            <div className="flex gap-1 min-w-max mt-1">
                              {hourEvals.map(({ hour }, i) => (
                                <div key={i} className="w-3 shrink-0 text-center">
                                  {i % 3 === 0 && <span className="text-sm font-mono text-zinc-600">{hour.hourLabel}</span>}
                                </div>
                              ))}
                            </div>
                          </div>
                          <div className="flex items-center gap-4 mt-3 text-sm text-zinc-500 flex-wrap">
                            <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-emerald-500" /> Good</span>
                            <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-red-500" /> Skip</span>
                            {!noCommute && (
                              <span className="flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-amber-400" /> Commute window</span>
                            )}
                            <span className="flex items-center gap-1.5"><span className="w-0.5 h-2.5 bg-amber-400/70" /> Sunrise/sunset</span>
                          </div>
                        </div>

                        <div className="rounded-2xl border border-zinc-800 bg-zinc-900 card-pad">
                          <h3 className="text-sm font-semibold uppercase tracking-widest text-amber-400 mb-3">Hour by hour</h3>
                          <div className="space-y-1.5 max-h-96 overflow-y-auto pr-1">
                            {hourEvals.map(({ hour, ev }, i) => {
                              const isDark = activeDay && activeDay.sun && hourIsDark(hour, activeDay.sun);
                              return (
                                <div
                                  key={i}
                                  className={`rounded-lg px-2 py-1.5 flex items-center gap-1.5 min-w-0 ${
                                    !noCommute && (inMorningWindow(hour) || inEveningWindow(hour)) ? "bg-zinc-800/70" : ""
                                  }`}
                                >
                                  <span className="font-mono text-sm text-zinc-300 w-10 shrink-0">{hour.hourLabel}</span>
                                  <WeatherIcon category={ev.category} className="w-4 h-4 text-zinc-500 shrink-0" />
                                  {isDark && <Moon className="w-3 h-3 text-zinc-600 shrink-0" />}
                                  <span className="font-mono text-sm text-zinc-300 w-10 shrink-0">{isNum(hour.temp) ? `${Math.round(hour.temp)}°` : "—"}</span>
                                  <span className="flex items-center gap-1 text-sm text-zinc-500 w-11 shrink-0">
                                    <Wind className="w-3 h-3 shrink-0" />
                                    {isNum(hour.wind) ? Math.round(hour.wind) : "—"}
                                  </span>
                                  {ev.good ? (
                                    <CheckCircle2 className="w-4 h-4 text-emerald-500 ml-auto shrink-0" />
                                  ) : (
                                    <div className="flex items-center gap-1 min-w-0 flex-1 justify-end">
                                      {ev.reasons.slice(0, 2).map((r, ri) => (
                                        <span
                                          key={ri}
                                          className="hour-reason-pill text-sm text-red-300 bg-red-500/10 border border-red-900 rounded px-1.5 py-0.5 truncate"
                                          title={r}
                                        >
                                          {r}
                                        </span>
                                      ))}
                                    </div>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      </>
                    )}
                  </div>
                )}
              </>
            ) : (
              <div className="text-center text-zinc-500 text-sm py-20 empty-ride">
                <MotoSilhouette className="w-28 h-14 mx-auto text-zinc-700 mb-3" />
                <div>No forecast loaded yet.</div>
              </div>
            )}
          </>
        )}
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
<script>
(function () {
  var rootEl = document.getElementById("root");

  function showError(err) {
    if (rootEl.hasChildNodes()) return; // a working UI already mounted, don't clobber it
    var msg = (err && (err.stack || err.message)) || String(err);
    rootEl.innerHTML =
      '<div style="min-height:100vh;background:#09090b;color:#fca5a5;' +
      'font-family:ui-monospace,SFMono-Regular,monospace;font-size:13px;' +
      'padding:20px;white-space:pre-wrap;line-height:1.5;">' +
      'Ride Check failed to start:\n\n' + msg.replace(/</g, "&lt;") +
      '</div>';
  }

  window.addEventListener("error", function (e) { showError(e.error || e.message); });
  window.addEventListener("unhandledrejection", function (e) { showError(e.reason); });

  try {
    var source = document.getElementById("app-source").textContent;
    var out;
    try {
      out = Babel.transform(source, { presets: [["react", { runtime: "classic" }]] }).code;
    } catch (e1) {
      out = Babel.transform(source, { plugins: [["transform-react-jsx", { runtime: "classic" }]] }).code;
    }
    var s = document.createElement("script");
    s.textContent = out;
    document.body.appendChild(s);
  } catch (err) {
    showError(err);
  }
})();
</script>

</body>
</html>
