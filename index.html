<div id="root"></div>
<script type="text/plain" id="app-source">
const { useState, useEffect, useMemo, useCallback } = React;

// Local storage shim so saved data lives in the browser, not Claude's sandbox
const storage = {
  get: async (key) => {
    try {
      const raw = localStorage.getItem(key);
      return raw !== null ? { key, value: raw } : null;
    } catch (e) {
      return null;
    }
  },
  set: async (key, value) => {
    try {
      localStorage.setItem(key, value);
      return { key, value };
    } catch (e) {
      return null;
    }
  },
};

// Minimal inline icon set (no external icon library needed)
const IconBase = ({ children, className }) => (

const Bike = (p) => <IconBase className={p.className}><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17 9 10h5l3 7"/><path d="M9 10 8 6h3"/></IconBase>;

const MapPin = (p) => <IconBase className={p.className}><path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></IconBase>;

const CheckCircle2 = (p) => <IconBase className={p.className}><circle cx="12" cy="12" r="9"/><path d="m9 12 2 2 4-4"/></IconBase>;

const Sun = (p) => <IconBase className={p.className}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></IconBase>;
const Cloud = (p) => <IconBase className={p.className}><path d="M7 18a4 4 0 1 1 .7-7.94A5.5 5.5 0 0 1 18 12.5 3.5 3.5 0 0 1 17.5 18H7z"/></IconBase>;

const CloudFog = (p) => <IconBase className={p.className}><path d="M7 12a4 4 0 1 1 .7-7.94A5.5 5.5 0 0 1 18 6.5 3.5 3.5 0 0 1 17.5 12H7z"/><path d="M4 16h16M6 20h12"/></IconBase>;
const CloudSnow = (p) => <IconBase className={p.className}><path d="M7 13a4 4 0 1 1 .7-7.94A5.5 5.5 0 0 1 18 7.5 3.5 3.5 0 0 1 17.5 13H7z"/><path d="M8 18v.01M12 20v.01M16 18v.01M8 21v.01M16 21v.01"/></IconBase>;
const CloudLightning = (p) => <IconBase className={p.className}><path d="M7 13a4 4 0 1 1 .7-7.94A5.5 5.5 0 0 1 18 7.5 3.5 3.5 0 0 1 17.5 13H8z"/><path d="m13 14-3 5h3l-1 4 4-6h-3z"/></IconBase>;
const Wind = (p) => <IconBase className={p.className}><path d="M3 8h9a2.5 2.5 0 1 0-2.5-2.5"/><path d="M3 12h13a2.5 2.5 0 1 1-2.5 2.5"/><path d="M3 16h7a2 2 0 1 1-2 2"/></IconBase>;
const Navigation = (p) => <IconBase className={p.className}><path d="M12 2 4 21l8-4 8 4z"/></IconBase>;
const X = (p) => <IconBase className={p.className}><path d="M18 6 6 18M6 6l12 12"/></IconBase>;
const RotateCcw = (p) => <IconBase className={p.className}><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></IconBase>;
const AlertTriangle = (p) => <IconBase className={p.className}><path d="M10.3 3.9 2 19h20L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></IconBase>;
const ChevronLeft = (p) => <IconBase className={p.className}><path d="m15 18-6-6 6-6"/></IconBase>;
const ListChecks = (p) => <IconBase className={p.className}><path d="m3 6 1.5 1.5L7 5"/><path d="m3 12 1.5 1.5L7 11"/><path d="m3 18 1.5 1.5L7 17"/><path d="M11 6h10M11 12h10M11 18h10"/></IconBase>;
const Thermometer = (p) => <IconBase className={p.className}><path d="M14 4v10.5a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0z"/><circle cx="12" cy="17" r="1.4" fill="currentColor" stroke="none"/></IconBase>;
const Moon = (p) => <IconBase className={p.className}><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></IconBase>;
const Snowflake = (p) => <IconBase className={p.className}><path d="M12 2v20M4.2 7l15.6 10M4.2 17l15.6-10"/></IconBase>;
const Droplet = (p) => <IconBase className={p.className}><path d="M12 2s7 7.5 7 12.5a7 7 0 1 1-14 0C5 9.5 12 2 12 2z"/></IconBase>;
const STORAGE_KEY = "ride-check-data";
const STORAGE_KEY_LOG = "ride-check-log";

const DEFAULT_PREFS = {
  tempMin: 45,
  tempMax: 95,
  maxWind: 20,
  maxGust: 30,
  avoidRain: true,
  rainProbThreshold: 40,
  avoidFog: true,
  minVisibilityMiles: 2,
  avoidSnow: true,
  avoidHumidity: true,
  maxHumidity: 75,
  humidityTempThreshold: 70,
  hideOvernight: true,
  warnIceRisk: true,
  avoidDark: true,
  morningStart: "07:30",
  morningEnd: "08:30",
  eveningStart: "17:00",
  eveningEnd: "18:00",
};

const WEATHER_CODES = {
  0: ["Clear sky", "clear"], 1: ["Mainly clear", "clear"], 2: ["Partly cloudy", "cloudy"],
  3: ["Overcast", "cloudy"], 45: ["Fog", "fog"], 48: ["Rime fog", "fog"],
  51: ["Light drizzle", "rain"], 53: ["Drizzle", "rain"], 55: ["Dense drizzle", "rain"],
  56: ["Freezing drizzle", "rain"], 57: ["Freezing drizzle", "rain"], 61: ["Slight rain", "rain"],
  63: ["Rain", "rain"], 65: ["Heavy rain", "rain"], 66: ["Freezing rain", "rain"],
  67: ["Freezing rain", "rain"], 71: ["Slight snow", "snow"], 73: ["Snow", "snow"],
  75: ["Heavy snow", "snow"], 77: ["Snow grains", "snow"], 80: ["Rain showers", "rain"],
  81: ["Rain showers", "rain"], 82: ["Violent showers", "rain"], 85: ["Snow showers", "snow"],
  86: ["Snow showers", "snow"], 95: ["Thunderstorm", "storm"], 96: ["Thunderstorm + hail", "storm"],
  99: ["Thunderstorm + hail", "storm"],
};

function codeInfo(code) {
  return WEATHER_CODES[code] || ["Unknown", "clear"];
}

function WeatherIcon({ category, className }) {
  const map = {
    clear: Sun, cloudy: Cloud, fog: CloudFog, rain: CloudRain,
    snow: CloudSnow, storm: CloudLightning,
  };
  const Icon = map[category] || Cloud;
  return <Icon className={className} />;
}

function fmtHour12(hourNum) {
  const h = ((hourNum % 24) + 24) % 24;
  const period = h < 12 ? "a" : "p";
  let h12 = h % 12;
  if (h12 === 0) h12 = 12;
  return `${h12}${period}`;
}

function fmtTimeIso(iso) {
  if (!iso) return "--:--";
  const hh = parseInt(iso.slice(11, 13), 10);
  const mm = iso.slice(14, 16);
  const period = hh < 12 ? "AM" : "PM";
  let h12 = hh % 12;
  if (h12 === 0) h12 = 12;
  return `${h12}:${mm} ${period}`;
}

function nowKeyForTz(tz) {
  try {
    const parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: tz,
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      hourCycle: "h23",
    }).formatToParts(new Date());
    const get = (type) => parts.find((p) => p.type === type)?.value || "00";
    return `${get("year")}-${get("month")}-${get("day")}T${get("hour")}:${get("minute")}`;
  } catch (e) {
    return new Date().toISOString().slice(0, 16);
  }
}

function evaluateHour(hour, prefs, sun) {
  const reasons = [];
  const [, category] = codeInfo(hour.weathercode);

  if (hour.temp < prefs.tempMin) reasons.push(`Too cold (${Math.round(hour.temp)}°F)`);
  if (hour.temp > prefs.tempMax) reasons.push(`Too hot (${Math.round(hour.temp)}°F)`);
  if (hour.wind > prefs.maxWind) reasons.push(`Wind ${Math.round(hour.wind)} mph`);
  if (hour.gust > prefs.maxGust) reasons.push(`Gusts ${Math.round(hour.gust)} mph`);
  if (category === "storm") reasons.push("Thunderstorm");
  if (prefs.avoidRain && category !== "storm" && (category === "rain" || hour.precipProb >= prefs.rainProbThreshold)) {
    reasons.push(hour.precipProb >= prefs.rainProbThreshold ? `${hour.precipProb}% rain chance` : "Rain expected");
  }
  if (prefs.avoidSnow && category === "snow") reasons.push("Snow expected");
  if (prefs.avoidFog && (category === "fog" || hour.visibilityMiles < prefs.minVisibilityMiles)) {
    reasons.push(`Visibility ${hour.visibilityMiles.toFixed(1)} mi`);
  }
  if (prefs.avoidHumidity && hour.temp >= prefs.humidityTempThreshold && hour.humidity > prefs.maxHumidity) reasons.push(`${hour.humidity}% humidity`);
  if (prefs.warnIceRisk && hour.temp <= 34) reasons.push("Possible ice (≤34°F)");
  if (prefs.avoidDark && sun && (hour.iso < sun.sunriseIso || hour.iso > sun.sunsetIso)) {
    reasons.push("Outside daylight");
  }

  return { good: reasons.length === 0, reasons, category };
}

function hoursInWindow(hours, start, end) {
  const [sh] = start.split(":").map(Number);
  const [eh, em] = end.split(":").map(Number);
  const endHour = em > 0 ? eh : Math.max(eh - 1, sh);
  return hours.filter((h) => h.hourNum >= sh && h.hourNum <= endHour);
}

function commuteVerdict(hours, prefs, sun) {
  if (hours.length === 0) return { status: "unknown", reasons: [] };
  const evals = hours.map((h) => evaluateHour(h, prefs, sun));
  const good = evals.every((e) => e.good);
  const reasons = [...new Set(evals.flatMap((e) => e.reasons))];
  return { status: good ? "good" : "bad", reasons };
}

function scoreFromHours(hours, prefs, sun) {
  if (!hours.length) return null;
  const goodCount = hours.filter((h) => evaluateHour(h, prefs, sun).good).length;
  return { good: goodCount, total: hours.length };
}

function computeRideScore(morningHours, eveningHours, prefs, homeSun, workSun) {
  const m = scoreFromHours(morningHours, prefs, homeSun);
  const e = scoreFromHours(eveningHours, prefs, workSun);
  const totalGood = (m ? m.good : 0) + (e ? e.good : 0);
  const totalHours = (m ? m.total : 0) + (e ? e.total : 0);
  if (totalHours === 0) return null;
  return Math.round((totalGood / totalHours) * 100);
}

function conditionFlags(hours, prefs, sun) {
  const flags = { temp: false, wind: false, rain: false, fog: false, snow: false, storm: false, humidity: false, ice: false, dark: false };
  hours.forEach((hour) => {
    const [, category] = codeInfo(hour.weathercode);
    if (hour.temp < prefs.tempMin || hour.temp > prefs.tempMax) flags.temp = true;
    if (hour.wind > prefs.maxWind || hour.gust > prefs.maxGust) flags.wind = true;
    if (category === "storm") flags.storm = true;
    if (prefs.avoidRain && category !== "storm" && (category === "rain" || hour.precipProb >= prefs.rainProbThreshold)) flags.rain = true;
    if (prefs.avoidSnow && category === "snow") flags.snow = true;
    if (prefs.avoidFog && (category === "fog" || hour.visibilityMiles < prefs.minVisibilityMiles)) flags.fog = true;
    if (prefs.avoidHumidity && hour.temp >= prefs.humidityTempThreshold && hour.humidity > prefs.maxHumidity) flags.humidity = true;
    if (prefs.warnIceRisk && hour.temp <= 34) flags.ice = true;
    if (prefs.avoidDark && sun && (hour.iso < sun.sunriseIso || hour.iso > sun.sunsetIso)) flags.dark = true;
  });
  return flags;
}

function mergeFlags(a, b) {
  const out = {};
  Object.keys(a).forEach((k) => { out[k] = a[k] || b[k]; });
  return out;
}

function gearSuggestion(temp, flags) {
  if (temp === null || temp === undefined) return null;
  let jacket, gloves;
  const extra = [];
  if (temp < 32) { jacket = "Insulated/heated suit"; gloves = "Insulated winter gloves"; extra.push("Balaclava or neck gaiter"); }
  else if (temp < 45) { jacket = "Insulated jacket + thermal liner"; gloves = "Winter gloves"; extra.push("Neck gaiter"); }
  else if (temp < 60) { jacket = "Mid-weight jacket + liner"; gloves = "Mid-weight gloves"; }
  else if (temp < 75) { jacket = "Standard armored jacket"; gloves = "Standard gloves"; }
  else if (temp < 85) { jacket = "Vented/mesh jacket"; gloves = "Lightweight gloves"; }
  else { jacket = "Mesh jacket, minimal layers"; gloves = "Vented gloves"; extra.push("Bring water"); }
  if (flags.rain) extra.push("Rain gear");
  if (flags.wind) extra.push("Wind-resistant layer");
  return { jacket, gloves, extra };
}

function polarPoint(cx, cy, r, tFrac) {
  const phi = ((135 + 270 * tFrac) * Math.PI) / 180;
  return [cx + r * Math.cos(phi), cy + r * Math.sin(phi)];
}

function arcPath(cx, cy, r, t0, t1) {
  const [x0, y0] = polarPoint(cx, cy, r, t0);
  const [x1, y1] = polarPoint(cx, cy, r, t1);
  const largeArc = (t1 - t0) * 270 > 180 ? 1 : 0;
  return `M ${x0} ${y0} A ${r} ${r} 0 ${largeArc} 1 ${x1} ${y1}`;
}

function rawHourFraction(iso, startHour, tickCount) {
  const hh = parseInt(iso.slice(11, 13), 10);
  const mm = parseInt(iso.slice(14, 16), 10);
  return (hh + mm / 60 - startHour) / tickCount;
}

function clampedHourFraction(iso, hours) {
  if (!iso || !hours.length) return null;
  const f = rawHourFraction(iso, hours[0].hourNum, hours.length);
  if (f < 0 || f > 1) return null;
  return f;
}

function darknessGradient(sun, hours) {
  if (!sun || !hours.length) return "none";
  const startHour = hours[0].hourNum;
  const sr = rawHourFraction(sun.sunriseIso, startHour, hours.length);
  const ss = rawHourFraction(sun.sunsetIso, startHour, hours.length);
  const dark = "rgba(0,0,0,0.45)";
  const clear = "rgba(0,0,0,0)";
  const pct = (f) => `${Math.max(-25, Math.min(125, f * 100)).toFixed(1)}%`;
  return `linear-gradient(to right, ${dark} 0%, ${dark} ${pct(sr)}, ${clear} ${pct(sr + 0.02)}, ${clear} ${pct(ss - 0.02)}, ${dark} ${pct(ss)}, ${dark} 100%)`;
}

function computeDays(weather) {
  if (!weather) return [];
  const h = weather.hourly;
  const tz = weather.timezone || Intl.DateTimeFormat().resolvedOptions().timeZone;
  const nowKey = nowKeyForTz(tz);
  const todayDateKey = nowKey.slice(0, 10);
  const nowHourKey = nowKey.slice(0, 13) + ":00";

  const dailySun = {};
  if (weather.daily) {
    weather.daily.time.forEach((d, i) => {
      dailySun[d] = {
        sunriseIso: weather.daily.sunrise[i],
        sunsetIso: weather.daily.sunset[i],
      };
    });
  }

  const grouped = {};
  h.time.forEach((t, i) => {
    const dateKey = t.slice(0, 10);
    const hourNum = parseInt(t.slice(11, 13), 10);
    if (!grouped[dateKey]) grouped[dateKey] = [];
    grouped[dateKey].push({
      iso: t,
      hourNum,
      hourLabel: fmtHour12(hourNum),
      temp: h.temperature_2m[i],
      precipProb: h.precipitation_probability[i],
      wind: h.windspeed_10m[i],
      gust: h.windgusts_10m[i],
      visibilityMiles: h.visibility[i] / 1609.34,
      weathercode: h.weathercode[i],
      humidity: h.relative_humidity_2m[i],
    });
  });

  return Object.entries(grouped)
    .slice(0, 7)
    .map(([date, hours]) => {
      const isToday = date === todayDateKey;
      const filteredHours = isToday ? hours.filter((x) => x.iso >= nowHourKey) : hours;
      const noon = new Date(date + "T12:00:00");
      return {
        date,
        isToday,
        dateLabel: noon.toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" }),
        shortLabel: noon.toLocaleDateString([], { weekday: "short" }),
        hours: filteredHours,
        sun: dailySun[date],
      };
    });
}

function LocationPicker({ value, onChange, allowCurrent = true }) {
  const [query, setQuery] = useState("");
  const [results, setResults] = useState([]);
  const [searching, setSearching] = useState(false);
  const [locating, setLocating] = useState(false);
  const [err, setErr] = useState(null);

  const search = async () => {
    if (!query.trim()) return;
    setSearching(true);
    setResults([]);
    setErr(null);
    try {
      const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query.trim())}&format=json&addressdetails=1&limit=5`;
      const res = await fetch(url);
      const json = await res.json();
      if (!json || json.length === 0) setErr("No matching places found.");
      setResults(json || []);
    } catch (e) {
      setErr("Location search failed.");
    } finally {
      setSearching(false);
    }
  };

  const useCurrent = () => {
    if (!navigator.geolocation) {
      setErr("Geolocation isn't available here.");
      return;
    }
    setLocating(true);
    setErr(null);
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        onChange({ name: "Current location", lat: pos.coords.latitude, lon: pos.coords.longitude });
        setLocating(false);
      },
      () => {
        setErr("Couldn't get your location — enter it manually.");
        setLocating(false);
      },
      { timeout: 8000 }
    );
  };

  if (value) {
    return (
      <div className="flex items-center justify-between rounded-lg bg-zinc-800 px-3 py-2">
        <span className="flex items-center gap-2 text-sm truncate">
          <MapPin className="w-4 h-4 text-amber-400 shrink-0" />
          <span className="truncate">{value.name}</span>
        </span>
        <button onClick={() => onChange(null)} className="text-zinc-500 hover:text-zinc-300 shrink-0">
          <X className="w-4 h-4" />
        </button>
      </div>
    );
  }

  return (
    <div className="space-y-2">
      <div className="flex gap-2">
        <input
          type="text"
          value={query}
          onChange={(e) => setQuery(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && search()}
          placeholder="Street address, city, or zip"
          className="flex-1 rounded-lg border border-zinc-700 bg-zinc-800 px-3 py-2 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-amber-400"
        />
        <button onClick={search} className="px-3 rounded-lg bg-zinc-800 border border-zinc-700 text-zinc-300 hover:bg-zinc-700">
          {searching ? <Loader2 className="w-4 h-4 animate-spin" /> : <Search className="w-4 h-4" />}
        </button>
      </div>
      {allowCurrent && (
        <button onClick={useCurrent} className="flex items-center gap-1.5 text-xs text-amber-400 hover:text-amber-300">
          {locating ? <Loader2 className="w-3.5 h-3.5 animate-spin" /> : <Navigation className="w-3.5 h-3.5" />}
          Use my current location
        </button>
      )}
      {err && <p className="text-xs text-red-400">{err}</p>}
      {results.length > 0 && (
        <div className="space-y-1 pt-1">
          {results.map((r, i) => (
            <button
              key={i}
              onClick={() => {
                onChange({ name: r.display_name.split(",").slice(0, 3).join(",").trim(), lat: parseFloat(r.lat), lon: parseFloat(r.lon) });
                setResults([]);
                setQuery("");
              }}
              className="w-full text-left text-sm px-3 py-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-200"
            >
              {r.display_name}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function RideGauge({ score }) {
  const cx = 100, cy = 105, r = 82;
  const known = score !== null && score !== undefined;
  const clamped = known ? Math.max(0, Math.min(100, score)) : 0;
  const needleRotation = 270 * (clamped / 100) - 135;
  const zones = [
    { from: 0, to: 0.49, color: "#ef4444" },
    { from: 0.49, to: 0.7, color: "#f59e0b" },
    { from: 0.7, to: 1, color: "#10b981" },
  ];
  return (
    <svg viewBox="0 0 200 150" className="w-full max-w-[220px] mx-auto">
      {[0, 0.25, 0.5, 0.75, 1].map((t, i) => {
        const [x1, y1] = polarPoint(cx, cy, r + 6, t);
        const [x2, y2] = polarPoint(cx, cy, r + 15, t);
        return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="#52525b" strokeWidth="2" />;
      })}
      {zones.map((z, i) => (
        <path key={i} d={arcPath(cx, cy, r, z.from, z.to)} fill="none" stroke={z.color} strokeWidth="10" opacity={known ? 0.9 : 0.25} />
      ))}
      {known && (
        <g transform={`rotate(${needleRotation} ${cx} ${cy})`}>
          <polygon points={`${cx},${cy - r + 20} ${cx - 3.5},${cy} ${cx + 3.5},${cy}`} fill="#f4f4f5" />
        </g>
      )}
      <circle cx={cx} cy={cy} r="7" fill="#18181b" stroke="#fbbf24" strokeWidth="2" />
      <text x={cx} y={cy + 36} textAnchor="middle" fontFamily="ui-monospace, monospace" fontSize="26" fontWeight="700" fill="#f4f4f5">
        {known ? clamped : "\u2014"}
      </text>
    </svg>
  );
}

function App() {
  const [loaded, setLoaded] = useState(false);
  const [data, setData] = useState(null);
  const [editing, setEditing] = useState(false);
  const [showLog, setShowLog] = useState(false);
  const [weatherHome, setWeatherHome] = useState(null);
  const [weatherWork, setWeatherWork] = useState(null);
  const [loadingWeather, setLoadingWeather] = useState(false);
  const [error, setError] = useState(null);
  const [dayIndex, setDayIndex] = useState(0);
  const [mainView, setMainView] = useState("daily");
  const [hourlyLoc, setHourlyLoc] = useState("home");
  const [rideLog, setRideLog] = useState({});

  const [formPrefs, setFormPrefs] = useState(DEFAULT_PREFS);
  const [formLocations, setFormLocations] = useState({ home: null, work: null });

  const loadWeather = useCallback(async (locations) => {
    setLoadingWeather(true);
    setError(null);
    try {
      const fetchOne = (loc) =>
        fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&hourly=temperature_2m,precipitation_probability,precipitation,windspeed_10m,windgusts_10m,visibility,weathercode,relative_humidity_2m&daily=sunrise,sunset&temperature_unit=fahrenheit&windspeed_unit=mph&timezone=auto&forecast_days=7`
        ).then((r) => {
          if (!r.ok) throw new Error("bad response");
          return r.json();
        });

      const [homeJson, workJson] = await Promise.all([
        fetchOne(locations.home),
        locations.work ? fetchOne(locations.work) : Promise.resolve(null),
      ]);
      setWeatherHome(homeJson);
      setWeatherWork(workJson);
      setDayIndex(0);
    } catch (e) {
      setError("Couldn't load the forecast. Check your connection and try again.");
    } finally {
      setLoadingWeather(false);
    }
  }, []);

  const persistLog = async (log) => {
    try {
      await storage.set(STORAGE_KEY_LOG, JSON.stringify(log), false);
    } catch (e) {
      // best effort
    }
  };

  const toggleLog = (dateKey, leg) => {
    if (!dateKey) return;
    setRideLog((prev) => {
      const entry = { ...(prev[dateKey] || { morning: false, evening: false }) };
      entry[leg] = !entry[leg];
      const next = { ...prev, [dateKey]: entry };
      persistLog(next);
      return next;
    });
  };

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get(STORAGE_KEY, false);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          const locations = parsed.locations || (parsed.location ? { home: parsed.location, work: null } : { home: null, work: null });
          const normalized = { prefs: { ...DEFAULT_PREFS, ...parsed.prefs }, locations };
          setData(normalized);
          setFormPrefs(normalized.prefs);
          setFormLocations(normalized.locations);
          if (normalized.locations.home) loadWeather(normalized.locations);
          else setEditing(true);
        } else {
          setEditing(true);
        }
      } catch (e) {
        setEditing(true);
      }
      try {
        const logRes = await storage.get(STORAGE_KEY_LOG, false);
        if (logRes && logRes.value) setRideLog(JSON.parse(logRes.value));
      } catch (e) {
        // no log yet
      }
      setLoaded(true);
    })();
  }, [loadWeather]);

  const openEdit = () => {
    if (data) {
      setFormPrefs({ ...DEFAULT_PREFS, ...data.prefs });
      setFormLocations(data.locations);
    }
    setShowLog(false);
    setError(null);
    setEditing(true);
  };

  const savePrefs = async () => {
    if (!formLocations.home) {
      setError("Set a home location before saving.");
      return;
    }
    const newData = { prefs: formPrefs, locations: formLocations };
    try {
      await storage.set(STORAGE_KEY, JSON.stringify(newData), false);
    } catch (e) {
      // non-fatal
    }
    setData(newData);
    setEditing(false);
    setError(null);
    loadWeather(formLocations);
  };

  const prefs = data ? data.prefs : DEFAULT_PREFS;
  const homeDaysRaw = useMemo(() => computeDays(weatherHome), [weatherHome]);
  const workDaysRaw = useMemo(() => computeDays(weatherWork), [weatherWork]);
  const filterOvernight = (days) =>
    prefs.hideOvernight
      ? days.map((d) => ({ ...d, hours: d.hours.filter((h) => h.hourNum >= 5 && h.hourNum < 23) }))
      : days;
  const homeDays = filterOvernight(homeDaysRaw);
  const workDays = filterOvernight(workDaysRaw);
  const hasWork = !!(data && data.locations && data.locations.work);
  const homeDay = homeDays[dayIndex] || homeDays[0];
  const workDay = hasWork && workDays[dayIndex] ? workDays[dayIndex] : homeDay;

  const morningVerdict = homeDay
    ? commuteVerdict(hoursInWindow(homeDay.hours, prefs.morningStart, prefs.morningEnd), prefs, homeDay.sun)
    : { status: "unknown", reasons: [] };
  const eveningVerdict = workDay
    ? commuteVerdict(hoursInWindow(workDay.hours, prefs.eveningStart, prefs.eveningEnd), prefs, workDay.sun)
    : { status: "unknown", reasons: [] };

  const activeDay = hourlyLoc === "work" && hasWork && workDays[dayIndex] ? workDays[dayIndex] : homeDay;

  const hourEvals = useMemo(() => {
    if (!activeDay) return [];
    return activeDay.hours.map((h) => ({ hour: h, ev: evaluateHour(h, prefs, activeDay.sun) }));
  }, [activeDay, prefs]);

  const maxTemp = hourEvals.length ? Math.max(...hourEvals.map((x) => x.hour.temp)) : 100;
  const minTemp = hourEvals.length ? Math.min(...hourEvals.map((x) => x.hour.temp)) : 30;
  const tempRange = Math.max(maxTemp - minTemp, 1);

  const gaugeHours = hourEvals.map((x) => x.hour);
  const gaugeSun = activeDay ? activeDay.sun : null;
  const gaugeGradient = darknessGradient(gaugeSun, gaugeHours);
  const sunriseFrac = clampedHourFraction(gaugeSun && gaugeSun.sunriseIso, gaugeHours);
  const sunsetFrac = clampedHourFraction(gaugeSun && gaugeSun.sunsetIso, gaugeHours);

  const inMorningWindow = (h) => hoursInWindow([h], prefs.morningStart, prefs.morningEnd).length > 0;
  const inEveningWindow = (h) => hoursInWindow([h], prefs.eveningStart, prefs.eveningEnd).length > 0;

  const morningWindowHours = homeDay ? hoursInWindow(homeDay.hours, prefs.morningStart, prefs.morningEnd) : [];
  const eveningWindowHours = workDay ? hoursInWindow(workDay.hours, prefs.eveningStart, prefs.eveningEnd) : [];
  const rideScore = computeRideScore(morningWindowHours, eveningWindowHours, prefs, homeDay && homeDay.sun, workDay && workDay.sun);
  const warningFlags = mergeFlags(
    conditionFlags(morningWindowHours, prefs, homeDay && homeDay.sun),
    conditionFlags(eveningWindowHours, prefs, workDay && workDay.sun)
  );

  const allWindowHours = [...morningWindowHours, ...eveningWindowHours];
  const minWindowTemp = allWindowHours.length ? Math.min(...allWindowHours.map((h) => h.temp)) : null;
  const gear = gearSuggestion(minWindowTemp, warningFlags);

  const todayKey = homeDays[0] ? homeDays[0].date : null;

  const logStats = useMemo(() => {
    const entries = Object.entries(rideLog)
      .filter(([, v]) => v && (v.morning || v.evening))
      .sort((a, b) => b[0].localeCompare(a[0]));
    let totalMornings = 0;
    let totalEvenings = 0;
    entries.forEach(([, v]) => {
      if (v.morning) totalMornings += 1;
      if (v.evening) totalEvenings += 1;
    });
    return { entries, totalMornings, totalEvenings, totalDays: entries.length };
  }, [rideLog]);

  if (!loaded) {
    return (
      <div className="min-h-screen bg-zinc-950 flex items-center justify-center">
        <Loader2 className="w-6 h-6 text-amber-400 animate-spin" />
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-zinc-950 text-zinc-100 font-sans safe-bottom-pad">
      <header className="sticky top-0 z-10 bg-zinc-950/95 backdrop-blur border-b border-zinc-800 px-4 pb-3 safe-top flex items-center justify-between gap-2">
        <div className="flex items-center gap-2 shrink-0">
          <Bike className="w-5 h-5 text-amber-400" />
          <span className="font-mono font-bold tracking-widest text-sm">RIDE CHECK</span>
        </div>
        {data && !editing && (
          <div className="flex items-center gap-1 min-w-0">
            <span className="flex items-center gap-1 text-xs text-zinc-500 min-w-0 mr-1">
              <MapPin className="w-3.5 h-3.5 shrink-0" />
              <span className="truncate">{data.locations.home.name}{hasWork ? " +1" : ""}</span>
            </span>
            <button onClick={() => setShowLog(!showLog)} className={`p-1.5 rounded-lg hover:bg-zinc-800 shrink-0 ${showLog ? "text-amber-400" : "text-zinc-400"}`}>
              <ListChecks className="w-5 h-5" />
            </button>
            <button onClick={openEdit} className="p-1.5 rounded-lg hover:bg-zinc-800 text-zinc-400 shrink-0">
              <Settings2 className="w-5 h-5" />
            </button>
          </div>
        )}
      </header>

      <main className="max-w-md mx-auto px-4 py-4 space-y-4">
        {editing ? (
          <div className="space-y-4">
            <SectionCard title="Home location">
              <LocationPicker value={formLocations.home} onChange={(loc) => setFormLocations((p) => ({ ...p, home: loc }))} />
            </SectionCard>

            <SectionCard title="Work location (optional)">
              <p className="text-xs text-zinc-500">Set this if your evening commute weather should be checked separately from home.</p>
              <LocationPicker value={formLocations.work} onChange={(loc) => setFormLocations((p) => ({ ...p, work: loc }))} />
            </SectionCard>

            <SectionCard title="Commute times">
              <div className="grid grid-cols-2 gap-3">
                <TimeField label="Morning start" value={formPrefs.morningStart} onChange={(v) => setFormPrefs({ ...formPrefs, morningStart: v })} />
                <TimeField label="Morning end" value={formPrefs.morningEnd} onChange={(v) => setFormPrefs({ ...formPrefs, morningEnd: v })} />
                <TimeField label="Evening start" value={formPrefs.eveningStart} onChange={(v) => setFormPrefs({ ...formPrefs, eveningStart: v })} />
                <TimeField label="Evening end" value={formPrefs.eveningEnd} onChange={(v) => setFormPrefs({ ...formPrefs, eveningEnd: v })} />
              </div>
            </SectionCard>

            <SectionCard title="Temperature">
              <div className="grid grid-cols-2 gap-3">
                <NumberField label="Min" unit="°F" value={formPrefs.tempMin} onChange={(v) => setFormPrefs({ ...formPrefs, tempMin: v })} min={-20} max={130} />
                <NumberField label="Max" unit="°F" value={formPrefs.tempMax} onChange={(v) => setFormPrefs({ ...formPrefs, tempMax: v })} min={-20} max={130} />
              </div>
            </SectionCard>

            <SectionCard title="Wind">
              <div className="grid grid-cols-2 gap-3">
                <NumberField label="Max sustained" unit="mph" value={formPrefs.maxWind} onChange={(v) => setFormPrefs({ ...formPrefs, maxWind: v })} min={0} max={80} />
                <NumberField label="Max gust" unit="mph" value={formPrefs.maxGust} onChange={(v) => setFormPrefs({ ...formPrefs, maxGust: v })} min={0} max={100} />
              </div>
            </SectionCard>

            <SectionCard title="Precipitation & visibility">
              <Toggle label="Avoid rain" checked={formPrefs.avoidRain} onChange={(v) => setFormPrefs({ ...formPrefs, avoidRain: v })} />
              {formPrefs.avoidRain && (
                <NumberField label="Rain chance threshold" unit="%" value={formPrefs.rainProbThreshold} onChange={(v) => setFormPrefs({ ...formPrefs, rainProbThreshold: v })} min={0} max={100} step={5} />
              )}
              <Toggle label="Avoid snow" checked={formPrefs.avoidSnow} onChange={(v) => setFormPrefs({ ...formPrefs, avoidSnow: v })} />
              <Toggle label="Avoid fog" checked={formPrefs.avoidFog} onChange={(v) => setFormPrefs({ ...formPrefs, avoidFog: v })} />
              {formPrefs.avoidFog && (
                <NumberField label="Min visibility" unit="mi" value={formPrefs.minVisibilityMiles} onChange={(v) => setFormPrefs({ ...formPrefs, minVisibilityMiles: v })} min={0} max={10} step={0.5} />
              )}
            </SectionCard>

            <SectionCard title="Humidity">
              <Toggle label="Avoid high humidity" hint="Muggy air fogs visors and saps energy fast" checked={formPrefs.avoidHumidity} onChange={(v) => setFormPrefs({ ...formPrefs, avoidHumidity: v })} />
              {formPrefs.avoidHumidity && (
                <>
                  <NumberField label="Max humidity" unit="%" value={formPrefs.maxHumidity} onChange={(v) => setFormPrefs({ ...formPrefs, maxHumidity: v })} min={0} max={100} step={5} />
                  <NumberField label="Only matters above" unit="°F" value={formPrefs.humidityTempThreshold} onChange={(v) => setFormPrefs({ ...formPrefs, humidityTempThreshold: v })} min={-20} max={130} />
                </>
              )}
            </SectionCard>

            <SectionCard title="Other safety factors">
              <Toggle label="Warn about ice risk" hint="Flags hours at or below 34°F" checked={formPrefs.warnIceRisk} onChange={(v) => setFormPrefs({ ...formPrefs, warnIceRisk: v })} />
              <Toggle label="Avoid riding in the dark" hint="Uses sunrise/sunset for your home location" checked={formPrefs.avoidDark} onChange={(v) => setFormPrefs({ ...formPrefs, avoidDark: v })} />
              <Toggle label="Hide overnight hours" hint="Removes 11pm–5am from every view" checked={formPrefs.hideOvernight} onChange={(v) => setFormPrefs({ ...formPrefs, hideOvernight: v })} />
            </SectionCard>

            {error && (
              <div className="flex items-center gap-2 text-sm text-red-400 bg-red-500/10 border border-red-900 rounded-lg px-3 py-2">
                <AlertTriangle className="w-4 h-4 shrink-0" />
                {error}
              </div>
            )}

            <div className="flex gap-3 pt-1">
              <button onClick={() => setFormPrefs(DEFAULT_PREFS)} className="flex items-center gap-1.5 text-xs text-zinc-500 hover:text-zinc-300 px-2">
                <RotateCcw className="w-3.5 h-3.5" /> Reset to defaults
              </button>
              <div className="flex-1" />
              {data && (
                <button onClick={() => { setEditing(false); setError(null); }} className="px-4 py-2 rounded-lg text-zinc-400 hover:text-zinc-200">
                  Cancel
                </button>
              )}
              <button onClick={savePrefs} className="px-5 py-2 rounded-lg bg-amber-500 text-zinc-950 font-semibold hover:bg-amber-400">
                Save
              </button>
            </div>
          </div>
        ) : showLog ? (
          <div className="space-y-4">
            <button onClick={() => setShowLog(false)} className="flex items-center gap-1.5 text-sm text-zinc-400 hover:text-zinc-200">
              <ChevronLeft className="w-4 h-4" /> Back to forecast
            </button>

            <div className="grid grid-cols-3 gap-3">
              <StatBlock label="Days ridden" value={logStats.totalDays} />
              <StatBlock label="Mornings" value={logStats.totalMornings} />
              <StatBlock label="Evenings" value={logStats.totalEvenings} />
            </div>

            <SectionCard title="History">
              {logStats.entries.length === 0 ? (
                <p className="text-sm text-zinc-500">No rides logged yet — mark today's ride from the forecast view.</p>
              ) : (
                <div className="space-y-1.5 max-h-96 overflow-y-auto pr-1">
                  {logStats.entries.map(([date, v]) => (
                    <div key={date} className="flex items-center justify-between rounded-lg bg-zinc-800/60 px-3 py-2">
                      <span className="font-mono text-sm text-zinc-300">{date}</span>
                      <div className="flex gap-2">
                        <LogPill label="AM" active={!!v.morning} onClick={() => toggleLog(date, "morning")} />
                        <LogPill label="PM" active={!!v.evening} onClick={() => toggleLog(date, "evening")} />
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </SectionCard>
          </div>
        ) : (
          <>
            {error && (
              <div className="flex items-center gap-2 text-sm text-red-400 bg-red-500/10 border border-red-900 rounded-lg px-3 py-2">
                <AlertTriangle className="w-4 h-4 shrink-0" />
                {error}
              </div>
            )}

            {loadingWeather && !weatherHome ? (
              <div className="flex items-center justify-center py-20">
                <Loader2 className="w-6 h-6 text-amber-400 animate-spin" />
              </div>
            ) : homeDays.length > 0 ? (
              <>
                <div className="flex rounded-xl border border-zinc-800 p-1 bg-zinc-900">
                  <button onClick={() => setMainView("daily")} className={`flex-1 py-1.5 rounded-lg text-xs font-mono tracking-wide ${mainView === "daily" ? "bg-amber-500 text-zinc-950 font-bold" : "text-zinc-400"}`}>
                    DAILY
                  </button>
                  <button onClick={() => setMainView("week")} className={`flex-1 py-1.5 rounded-lg text-xs font-mono tracking-wide ${mainView === "week" ? "bg-amber-500 text-zinc-950 font-bold" : "text-zinc-400"}`}>
                    WEEK
                  </button>
                </div>

                {mainView === "week" ? (
                  <WeekView homeDays={homeDays} workDays={workDays} hasWork={hasWork} prefs={prefs} onSelectDay={(i) => { setDayIndex(i); setMainView("daily"); }} />
                ) : (
                  <>
                    <div className="flex gap-1.5">
                      {homeDays.map((d, i) => (
                        <button
                          key={d.date}
                          onClick={() => setDayIndex(i)}
                          className={`flex-1 rounded-xl py-2 text-xs font-mono tracking-wide border ${i === dayIndex ? "bg-amber-500 text-zinc-950 border-amber-500 font-bold" : "bg-zinc-900 text-zinc-400 border-zinc-800"}`}
                        >
                          {d.isToday ? "TODAY" : d.shortLabel.toUpperCase()}
                        </button>
                      ))}
                    </div>

                    <SunTimes sun={homeDay && homeDay.sun} />

                    {!homeDay || homeDay.hours.length === 0 ? (
                      <div className="text-center text-zinc-500 text-sm py-10">No more riding hours left today.</div>
                    ) : (
                      <>
                        <RideGaugeCard score={rideScore} flags={warningFlags} />

                        <div className="space-y-3">
                          <CommuteCard label="Morning commute" sublabel={hasWork ? `At ${data.locations.home.name}` : null} windowLabel={`${prefs.morningStart} – ${prefs.morningEnd}`} verdict={morningVerdict} />
                          <CommuteCard label="Evening commute" sublabel={hasWork ? `At ${data.locations.work.name}` : null} windowLabel={`${prefs.eveningStart} – ${prefs.eveningEnd}`} verdict={eveningVerdict} />
                        </div>

                        <GearCard gear={gear} />

                        {homeDay.isToday && (
                          <div className="rounded-2xl border border-zinc-800 bg-zinc-900 p-4">
                            <h3 className="text-xs font-semibold uppercase tracking-widest text-amber-400 mb-3">Log today's ride</h3>
                            <div className="flex gap-2">
                              <LogToggleButton label="Rode this morning" active={!!(rideLog[todayKey] && rideLog[todayKey].morning)} onClick={() => toggleLog(todayKey, "morning")} />
                              <LogToggleButton label="Rode this evening" active={!!(rideLog[todayKey] && rideLog[todayKey].evening)} onClick={() => toggleLog(todayKey, "evening")} />
                            </div>
                          </div>
                        )}

                        {hasWork && (
                          <div className="flex gap-2">
                            <button onClick={() => setHourlyLoc("home")} className={`flex-1 rounded-lg py-1.5 text-xs font-mono tracking-wide border ${hourlyLoc === "home" ? "bg-zinc-800 border-zinc-600 text-zinc-100" : "border-zinc-800 text-zinc-500"}`}>
                              HOME READOUT
                            </button>
                            <button onClick={() => setHourlyLoc("work")} className={`flex-1 rounded-lg py-1.5 text-xs font-mono tracking-wide border ${hourlyLoc === "work" ? "bg-zinc-800 border-zinc-600 text-zinc-100" : "border-zinc-800 text-zinc-500"}`}>
                              WORK READOUT
                            </button>
                          </div>
                        )}

                        <div className="rounded-2xl border border-zinc-800 bg-zinc-900 p-4">
                          <h3 className="text-xs font-semibold uppercase tracking-widest text-amber-400 mb-3">Hourly readout</h3>
                          <div className="overflow-x-auto">
                            <div className="relative min-w-max">
                              <div className="absolute inset-0 rounded-lg pointer-events-none" style={{ background: gaugeGradient }} />
                              {sunriseFrac !== null && (
                                <div className="absolute top-0 bottom-0 w-px bg-amber-400/70 pointer-events-none" style={{ left: `${sunriseFrac * 100}%` }} />
                              )}
                              {sunsetFrac !== null && (
                                <div className="absolute top-0 bottom-0 w-px bg-amber-400/70 pointer-events-none" style={{ left: `${sunsetFrac * 100}%` }} />
                              )}
                              <div className="relative flex items-end gap-1 h-20">
                                {hourEvals.map(({ hour, ev }, i) => {
                                  const pct = Math.max(((hour.temp - minTemp) / tempRange) * 100, 8);
                                  return (
                                    <div key={i} className="flex flex-col items-center justify-end h-full w-3 shrink-0">
                                      <div title={`${hour.hourLabel} — ${Math.round(hour.temp)}°F`} className={`w-2.5 rounded-t ${ev.good ? "bg-emerald-500" : "bg-red-500"}`} style={{ height: `${pct}%` }} />
                                      <div className={`w-1 h-1 rounded-full mt-1 ${inMorningWindow(hour) || inEveningWindow(hour) ? "bg-amber-400" : "bg-transparent"}`} />
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                            <div className="flex gap-1 min-w-max mt-1">
                              {hourEvals.map(({ hour }, i) => (
                                <div key={i} className="w-3 shrink-0 text-center">
                                  {i % 3 === 0 && <span className="text-xs font-mono text-zinc-600">{hour.hourLabel}</span>}
                                </div>
                              ))}
                            </div>
                          </div>
                          <div className="flex items-center gap-4 mt-3 text-xs text-zinc-500 flex-wrap">
                            <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-emerald-500" /> Good</span>
                            <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-red-500" /> Skip</span>
                            <span className="flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-amber-400" /> Commute window</span>
                            <span className="flex items-center gap-1.5"><span className="w-0.5 h-2.5 bg-amber-400/70" /> Sunrise/sunset</span>
                          </div>
                        </div>

                        <div className="rounded-2xl border border-zinc-800 bg-zinc-900 p-4">
                          <h3 className="text-xs font-semibold uppercase tracking-widest text-amber-400 mb-3">Hour by hour</h3>
                          <div className="space-y-1.5 max-h-96 overflow-y-auto pr-1">
                            {hourEvals.map(({ hour, ev }, i) => {
                              const isDark = activeDay && activeDay.sun && (hour.iso < activeDay.sun.sunriseIso || hour.iso > activeDay.sun.sunsetIso);
                              return (
                                <div key={i} className={`rounded-lg px-2 py-2 ${inMorningWindow(hour) || inEveningWindow(hour) ? "bg-zinc-800/70" : ""}`}>
                                  <div className="flex items-center gap-2">
                                    <span className="font-mono text-sm text-zinc-300 w-9 shrink-0">{hour.hourLabel}</span>
                                    <WeatherIcon category={ev.category} className="w-4 h-4 text-zinc-500 shrink-0" />
                                    {isDark && <Moon className="w-3 h-3 text-zinc-600 shrink-0" />}
                                    <span className="font-mono text-sm text-zinc-300 w-11 shrink-0">{Math.round(hour.temp)}°F</span>
                                    <span className="flex items-center gap-1 text-xs text-zinc-500 w-11 shrink-0">
                                      <Wind className="w-3 h-3 shrink-0" />{Math.round(hour.wind)}
                                    </span>
                                    {ev.good && <CheckCircle2 className="w-4 h-4 text-emerald-500 ml-auto shrink-0" />}
                                  </div>
                                  {!ev.good && (
                                    <div className="flex flex-wrap gap-1.5 mt-1.5">
                                      {ev.reasons.slice(0, 2).map((r, ri) => (
                                        <span key={ri} className="text-xs text-red-300 bg-red-500/10 border border-red-900 rounded px-1.5 py-0.5">{r}</span>
                                      ))}
                                    </div>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      </>
                    )}
                  </>
                )}
              </>
            ) : (
              <div className="text-center text-zinc-500 text-sm py-20">No forecast loaded yet.</div>
            )}
          </>
        )}
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
<script>
(function () {
  var rootEl = document.getElementById("root");

  function showError(err) {
    if (rootEl.hasChildNodes()) return; // a working UI already mounted, don't clobber it
    var msg = (err && (err.stack || err.message)) || String(err);
    rootEl.innerHTML =
      '<div style="min-height:100vh;background:#09090b;color:#fca5a5;' +
      'font-family:ui-monospace,SFMono-Regular,monospace;font-size:13px;' +
      'padding:20px;white-space:pre-wrap;line-height:1.5;">' +
      'Ride Check failed to start:\n\n' + msg.replace(/</g, "&lt;") +
      '</div>';
  }

  window.addEventListener("error", function (e) { showError(e.error || e.message); });
  window.addEventListener("unhandledrejection", function (e) { showError(e.reason); });

  try {
    var source = document.getElementById("app-source").textContent;
    var out;
    try {
      out = Babel.transform(source, { presets: [["react", { runtime: "classic" }]] }).code;
    } catch (e1) {
      out = Babel.transform(source, { plugins: [["transform-react-jsx", { runtime: "classic" }]] }).code;
    }
    var s = document.createElement("script");
    s.textContent = out;
    document.body.appendChild(s);
  } catch (err) {
    showError(err);
  }
})();
</script>

</body>
</html>
